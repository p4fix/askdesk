version: '3.8'

# Production hardened Compose configuration
services:
  db:
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G

  backend:
    restart: always
    environment:
      - DEBUG=False
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          memory: 512M
